# Production Profile

# HTTPS(Cloudflare) 환경에서만 세션 쿠키 전송
server.servlet.session.cookie.secure=true

# API 문서 비공개
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 운영 로그는 INFO 이상만 기록 (요청 본문·코드 등 민감 정보 유출 방지)
logging.level.com.ssafy.dash.github=INFO
logging.level.com.ssafy.dash.ai.infrastructure.client=INFO
